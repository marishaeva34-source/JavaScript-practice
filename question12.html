<!DOCTYPE html>
<html>
<head>
    <title>Exam Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Examination Countdown</h2>

    <label>Starting Number</label>
    <input type="number" id="number">

    <button onclick="countdown()">Start Countdown</button>

    <div id="result"></div>
</div>

<script>
function countdown() {
    let number = Number(document.getElementById("number").value);
    let result = "";

    if (number < 1) {
        document.getElementById("result").innerHTML = "Enter a valid number";
        return;
    }

    do {
        result += number + "<br>";
        number--;
    } while (number >= 1);

    result += "<b>Exam Time!</b>";

    document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
