<!DOCTYPE html>
<html>
<head>
    <title>Student Registration and Result</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="welcomeMessage()">

<div class="container">
    <h2>Student Registration and Result</h2>

    <p id="welcome"></p>

    <label>Student Name</label>
    <input type="text"
           id="name"
           onfocus="focusField(this)"
           onblur="blurField(this)">

    <label>Student ID</label>
    <input type="text"
           id="studentID"
           onfocus="focusField(this)"
           onblur="blurField(this)">

    <label>Department</label>
    <select id="department" onchange="selectDepartment()">
        <option value="">Select Department</option>
        <option value="ICE">ICE</option>
        <option value="CSE">CSE</option>
        <option value="EEE">EEE</option>
        <option value="ICT">ICT</option>
        <option value="Textile">Textile</option>
    </select>

    <p id="selectedDepartment"></p>

    <label>Subject 1 Marks</label>
    <input type="number"
           id="mark1"
           onfocus="focusField(this)"
           onblur="blurField(this)">

    <label>Subject 2 Marks</label>
    <input type="number"
           id="mark2"
           onfocus="focusField(this)"
           onblur="blurField(this)">

    <label>Subject 3 Marks</label>
    <input type="number"
           id="mark3"
           onfocus="focusField(this)"
           onblur="blurField(this)">

    <label>CGPA</label>
    <input type="number"
           id="cgpa"
           step="0.01"
           onfocus="focusField(this)"
           onblur="blurField(this)">

    <button onclick="submitResult()">Submit</button>

    <p id="message"></p>

    <div id="result"></div>
</div>

<script>
function welcomeMessage() {
    document.getElementById("welcome").innerHTML =
        "Welcome to Student Registration and Result System!";
}

function focusField(field) {
    field.style.backgroundColor = "#fff3cd";
}

function blurField(field) {
    field.style.backgroundColor = "white";
}

function selectDepartment() {
    let department = document.getElementById("department").value;

    document.getElementById("selectedDepartment").innerHTML =
        "Selected Department: " + department;
}

function submitResult() {
    let name = document.getElementById("name").value;
    let studentID = document.getElementById("studentID").value;
    let department = document.getElementById("department").value;
    let mark1 = Number(document.getElementById("mark1").value);
    let mark2 = Number(document.getElementById("mark2").value);
    let mark3 = Number(document.getElementById("mark3").value);
    let cgpa = Number(document.getElementById("cgpa").value);

    let total = mark1 + mark2 + mark3;
    let average = total / 3;
    let grade;

    if (average >= 80) {
        grade = "A+";
    } else if (average >= 70) {
        grade = "A";
    } else if (average >= 60) {
        grade = "B";
    } else if (average >= 50) {
        grade = "C";
    } else if (average >= 40) {
        grade = "D";
    } else {
        grade = "F";
    }

    document.getElementById("message").innerHTML =
        "Registration Submitted Successfully!";

    document.getElementById("result").innerHTML =
        "Student Name: " + name + "<br>" +
        "Student ID: " + studentID + "<br>" +
        "Department: " + department + "<br>" +
        "Subject 1: " + mark1 + "<br>" +
        "Subject 2: " + mark2 + "<br>" +
        "Subject 3: " + mark3 + "<br>" +
        "Total Marks: " + total + "<br>" +
        "Average Marks: " + average.toFixed(2) + "<br>" +
        "Grade: " + grade + "<br>" +
        "CGPA: " + cgpa;
}
</script>

</body>
</html>
