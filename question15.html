<!DOCTYPE html>
<html>
<head>
    <title>Welcome Button</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Welcome</h2>

    <button onclick="welcome()">Click Me</button>

    <p id="result"></p>
</div>

<script>
function welcome() {
    document.getElementById("result").innerHTML =
        "Welcome to JavaScript Laboratory!";
}
</script>

</body>
</html>
