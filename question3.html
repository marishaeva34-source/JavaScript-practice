<!DOCTYPE html>
<html>
<head>
    <title>Electricity Bill Calculator</title>
</head>
<body>

    <h2>Electricity Bill Calculator</h2>

    <div id="result"></div>
 <script>
 let units = 250;
 let bill;
  if (units <= 100) {
          bill = units * 5;
        } else if (units <= 200) {
           bill = (100 * 5) + ((units - 100) * 7);
        } else {
          bill = (100 * 5) + (100 * 7) + ((units - 200) * 10);
        }

       let message = "";

     if (units > 200) {
            message = "High Consumption";
      }

     document.getElementById("result").innerHTML =
          "Electricity Units: " + units + "<br>" +
           "Total Bill: Tk " + bill + "<br>" +
            message;
    </script>

</body>
</html>
