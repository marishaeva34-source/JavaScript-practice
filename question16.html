<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Mouse Events</h2>

    <div class="mouse-box"
         onmouseover="mouseOver()"
         onmouseout="mouseOut()">
        JavaScript Laboratory
    </div>

    <p id="result"></p>
</div>

<script>
function mouseOver() {
    document.getElementById("result").innerHTML =
        "Mouse is over the box";
}

function mouseOut() {
    document.getElementById("result").innerHTML =
        "Mouse has left the box";
}
</script>

</body>
</html>
